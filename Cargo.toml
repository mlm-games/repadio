[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
rubato = "4.0"
env_logger = "0.11"
log = "0.4"
symphonia = { version = "0.6", features = ["all"] }
symphonia-adapter-oporus = "0.1"
rlobkit-dialogs = "0.5"
# rlobkit-app-events = { path = "../rlobkit/rlobkit-app-events" }
rlobkit-app-events = { version = "0.5" }
futures-lite = "2"

repose-core = "0.28"
repose-ui = "0.28"
repose-material = "0.28"
repose-platform = "0.28"

web-workers = "0.3"

console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
opfs = { git = "https://github.com/mlm-games/opfs" }

cpal = "0.18"
winit = { version = "0.30" }
getrandom = { version = "0.3", features = ["wasm_js"] }
wgpu = { version = "30", features = ["webgpu", "webgl"] }

videoson = { git = "https://github.com/mlm-games/videoson", features = [
    "h264",
    "h265",
    "vp8",
    "vp9",
    "rav1d",
] }
# videoson = { path = "../videoson/videoson", features = [
#     "h264",
#     "h265",
#     "vp8",
#     "vp9",
#     "rav1d",
# ] }

web-time = "1.1.0"

player-core = { path = "crates/player-core" }
player-sync = { path = "crates/player-sync" }
player-platform = { path = "crates/player-platform" }

[patch.crates-io]
symphonia = { git = "https://github.com/mlm-games/symphonia", package = "symphonia" }
symphonia-core = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-core" }
symphonia-common = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-common" }
symphonia-metadata = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-metadata" }
symphonia-bundle-flac = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-bundle-flac" }
symphonia-bundle-mp3 = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-bundle-mp3" }
symphonia-codec-aac = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-codec-aac" }
symphonia-codec-adpcm = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-codec-adpcm" }
symphonia-codec-alac = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-codec-alac" }
symphonia-codec-pcm = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-codec-pcm" }
symphonia-codec-vorbis = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-codec-vorbis" }
symphonia-format-caf = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-format-caf" }
symphonia-format-isomp4 = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-format-isomp4" }
symphonia-format-mkv = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-format-mkv" }
symphonia-format-ogg = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-format-ogg" }
symphonia-format-riff = { git = "https://github.com/mlm-games/symphonia", package = "symphonia-format-riff" }
# repose-core = { path = "../repose/crates/repose-core" }
# repose-ui = { path = "../repose/crates/repose-ui" }
# repose-material = { path = "../repose/crates/repose-material" }
# repose-platform = { path = "../repose/crates/repose-platform" }

[dev-dependencies]
symphonia.workspace = true

[package]
name = "repadio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "repadio-desktop"

[lib]
name = "repadio"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repadio-desktop"
path = "src/main.rs"

[package.metadata.android]
package = "org.mlm.repadio"
apk_name = "repadio"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
]
split_per_abi = true
resources = "others/packaging/res"

[package.metadata.android.application]
label = "Repadio"
fullscreen = false
icon = "@drawable/ic_launcher_monochrome"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37
version_code = 16777731

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.application.activity]]
name = "rust.rlobkit.RlobKitMainActivity"
exported = true
launch_mode = "singleTask"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = [
    "android.intent.category.DEFAULT",
    "android.intent.category.BROWSABLE",
]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "audio/*"

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "audio/*"

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "video/*"

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "video/*"

[dependencies]
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true

player-core.workspace = true
player-sync.workspace = true
player-platform.workspace = true

repose-core.workspace = true
repose-ui.workspace = true
repose-material.workspace = true
repose-platform.workspace = true

winit.workspace = true
rlobkit-dialogs.workspace = true
rlobkit-app-events.workspace = true
web-time.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
rlobkit-app-events = { workspace = true, features = ["jni-bridge"] }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "HtmlCanvasElement",
    "Document",
    "Element",
    "Event",
    "EventTarget",
] }
console_error_panic_hook.workspace = true
console_log.workspace = true
getrandom.workspace = true
wgpu.workspace = true
web-workers.workspace = true
