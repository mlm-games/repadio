[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.93"
license = "LGPL-2.1-or-later"

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
rubato = "4.0"
env_logger = "0.11"
log = "0.4"
symphonia = { version = "0.6", features = ["all"] }
rlobkit-dialogs = "0.5"
# rlobkit-app-events = { path = "../rlobkit/rlobkit-app-events" }
rlobkit-app-events = { version = "0.5" }
futures-lite = "2"

repose-core = "0.23"
repose-ui = "0.23"
repose-material = "0.23"
repose-platform = "0.23"

console_error_panic_hook = "0.1"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
opfs = { git = "https://github.com/mlm-games/opfs" }

cpal = "0.18"
winit = { version = "0.30" }
getrandom = { version = "0.3", features = ["wasm_js"] }
wgpu = { version = "30", features = ["webgpu", "webgl"] }

videoson = { git = "https://github.com/mlm-games/videoson", rev = "02c1ebb2300137acc372577348422c795b90ac1c", features = [
    "h264",
] }


player-core = { path = "crates/player-core" }
player-sync = { path = "crates/player-sync" }
player-platform = { path = "crates/player-platform" }

# [patch.crates-io]
# repose-core = { path = "../repose/crates/repose-core" }
# repose-ui = { path = "../repose/crates/repose-ui" }
# repose-material = { path = "../repose/crates/repose-material" }
# repose-platform = { path = "../repose/crates/repose-platform" }
# repose-render-wgpu = { path = "../repose/crates/repose-render-wgpu" }

[package]
name = "repadio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "repadio-desktop"

[lib]
name = "repadio"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repadio-desktop"
path = "src/main.rs"

[package.metadata.android]
package = "org.mlm.repadio"
apk_name = "repadio"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
]
split_per_abi = true
resources = "others/packaging/res"

[package.metadata.android.application]
label = "Repadio"
fullscreen = false
icon = "@drawable/ic_launcher_monochrome"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36
version_code = 1

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.application.activity]]
name = "rust.rlobkit.RlobKitMainActivity"
exported = true
launch_mode = "singleTask"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = [
    "android.intent.category.DEFAULT",
    "android.intent.category.BROWSABLE",
]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "audio/*"

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "audio/*"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
crossbeam-channel.workspace = true

player-core.workspace = true
player-sync.workspace = true
player-platform.workspace = true

repose-core.workspace = true
repose-ui.workspace = true
repose-material.workspace = true
repose-platform.workspace = true

winit.workspace = true
rlobkit-dialogs.workspace = true
rlobkit-app-events.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
rlobkit-app-events = { workspace = true, features = ["jni-bridge"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "HtmlCanvasElement",
    "Document",
    "Element",
] }
console_error_panic_hook.workspace = true
console_log.workspace = true
getrandom.workspace = true
wgpu.workspace = true
web-thread = { git = "https://github.com/mlm-games/wasm-worker" }
