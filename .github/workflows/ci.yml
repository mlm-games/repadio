name: CI
on:
  pull_request:
  push:
    branches: "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  check-and-test:
    name: Check, lint, test (stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-26.04-arm
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libx11-dev libxcb1-dev libxi-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libfontconfig-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config
      - name: Configure pkg-config (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - name: Set up MSYS2 and install Windows dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf

      - name: Configure pkg-config and PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG=$msys2\mingw64\bin\pkgconf.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$msys2\mingw64\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_PATH -Value "$msys2\mingw64\bin"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --workspace

  android-apk:
    name: Android (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: x86_64-linux-android
            abi: x86_64
          - target: i686-linux-android
            abi: x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v4

      - name: Install Android platforms and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-rapk
        run: cargo install cargo-rapk@0.19.5 --locked

      - name: Build Android APK
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at || 0 }}
        run: |
          cargo rapk build --target ${{ matrix.target }} --lib
          OUT_DIR="target/debug/apk"
          if [ -d "target/${{ matrix.target }}/release/apk" ]; then
            OUT_DIR="target/${{ matrix.target }}/release/apk"
          fi
          ls -l "$OUT_DIR"
          mkdir -p artifacts
          cp "$(ls -1t "$OUT_DIR"/*.apk | head -n1)" "artifacts/app-${{ matrix.abi }}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: artifacts/*.apk
