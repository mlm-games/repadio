name: AUR upload (repadio-bin)

# Thin dispatcher: rust-app-release dispatches here with version_name,
# we delegate to the shared reusable (desktop entry + icon included).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 0.1.0)"
        required: true

jobs:
  aur-upload:
    uses: mlm-games/ci/.github/workflows/aur-upload.yml@v1
    with:
      pkgname: repadio-bin
      pkgdesc: "Pure-Rust audio player built with Symphonia and CPAL on the Repose GUI framework"
      binary-name: repadio-${{ inputs.version_name }}-x86_64-unknown-linux-gnu.tar.gz
      binary-name-aarch64: repadio-${{ inputs.version_name }}-aarch64-unknown-linux-gnu.tar.gz
      app-name: "Repadio"
      license: "GPL-3.0-or-later"
      provides: "repadio"
      conflicts: "repadio"
      desktop-categories: "Audio;AudioVideo;Video;Player;"
      desktop-mime-type: "application/mxf;application/ogg;application/sdp;application/smil;application/streamingmedia;application/vnd.apple.mpegurl;application/vnd.ms-asf;application/vnd.rn-realmedia;application/vnd.rn-realmedia-vbr;application/x-cue;application/x-extension-m4a;application/x-extension-mp4;application/x-matroska;application/x-mpegurl;application/x-ogm;application/x-ogm-audio;application/x-ogm-video;application/x-ogg;application/x-shorten;application/x-smil;application/x-streamingmedia;audio/3gpp;audio/3gpp2;audio/AMR;audio/aac;audio/ac3;audio/aiff;audio/amr-wb;audio/dv;audio/eac3;audio/flac;audio/m3u;audio/m4a;audio/midi;audio/mp1;audio/mp2;audio/mp3;audio/mp4;audio/mpeg;audio/mpeg2;audio/mpeg3;audio/mpegurl;audio/mpg;audio/musepack;audio/ogg;audio/opus;audio/rn-mpeg;audio/scpls;audio/vnd.dolby.heaac.1;audio/vnd.dolby.heaac.2;audio/vnd.dts;audio/vnd.dts.hd;audio/vnd.rn-realaudio;audio/vnd.wave;audio/vorbis;audio/wav;audio/webm;audio/x-adpcm;audio/x-aiff;audio/x-ape;audio/x-matroska;audio/x-mp1;audio/x-mp2;audio/x-mp3;audio/x-mpegurl;audio/x-mpg;audio/x-musepack;audio/x-ms-asf;audio/x-ms-wma;audio/x-pls;audio/x-pn-au;audio/x-pn-realaudio;audio/x-pn-wav;audio/x-pn-windows-pcm;audio/x-realaudio;audio/x-scpls;audio/x-shorten;audio/x-tta;audio/x-vorbis;audio/x-vorbis+ogg;audio/x-wav;audio/x-wavpack;video/3gp;video/3gpp;video/3gpp2;video/avi;video/divx;video/dv;video/fli;video/flv;video/mkv;video/mp2t;video/mp4;video/mp4v-es;video/mpeg;video/msvideo;video/ogg;video/quicktime;video/vnd.avi;video/vnd.divx;video/vnd.mpegurl;video/vnd.rn-realvideo;video/webm;video/x-avi;video/x-flic;video/x-flc;video/x-flv;video/x-m4v;video/x-matroska;video/x-mpeg2;video/x-mpeg3;video/x-ms-afs;video/x-ms-asf;video/x-ms-wmv;video/x-ms-wmx;video/x-ms-wvxvideo;video/x-msvideo;video/x-ogm;video/x-ogm+ogg;video/x-theora;video/x-theora+ogg;"
      desktop-args: "%F"
      icon-url: "https://raw.githubusercontent.com/mlm-games/repadio/main/others/packaging/icon.svg"
      version: ${{ inputs.version_name }}
      maintainer-name: "MLM Games"
      maintainer-email: "dev@mlm.games"
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
