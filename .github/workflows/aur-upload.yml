name: AUR upload (repadio-bin)

# Thin dispatcher: rust-app-release dispatches here with version_name,
# we delegate to the shared reusable (desktop entry + icon included).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 0.1.0)"
        required: true

jobs:
  aur-upload:
    uses: mlm-games/ci/.github/workflows/aur-upload.yml@v1
    with:
      pkgname: repadio-bin
      pkgdesc: "Pure-Rust audio player built with Symphonia and CPAL on the Repose GUI framework"
      binary-name: repadio-${{ inputs.version_name }}-x86_64-unknown-linux-gnu.tar.gz
      binary-name-aarch64: repadio-${{ inputs.version_name }}-aarch64-unknown-linux-gnu.tar.gz
      app-name: "Repadio"
      license: "GPL-3.0-or-later"
      provides: "repadio"
      conflicts: "repadio"
      desktop-categories: "Audio;AudioVideo;Player;"
      desktop-mime-type: "audio/mpeg;audio/flac;audio/ogg;audio/x-wav;audio/mp4;audio/aac;video/mp4;video/webm;video/x-matroska;video/quicktime;"
      desktop-args: "%F"
      icon-url: "https://raw.githubusercontent.com/mlm-games/repadio/main/others/packaging/icon.svg"
      version: ${{ inputs.version_name }}
      maintainer-name: "MLM Games"
      maintainer-email: "dev@mlm.games"
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
