name: Release binaries

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      upload_releases:
        description: "Upload releases"
        required: true
        default: true
        type: boolean
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      play_track:
        description: "Google Play track"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: release-bin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@v1
    with:
      working-directory: .
      app-name: 'Repadio'
      app-slug: 'repadio'
      bin-name: 'repadio-desktop'
      os-matrix: '["ubuntu-26.04","ubuntu-26.04-arm","macos-latest","windows-latest"]'
      cargo-rapk-version: '0.19.5'
      android-api: '37.0'
      android-build-tools: '37.0.0'
      android-ndk-version: '29.0.14206865'
      android-d8-version: ''
      java-version: '21'
      java-distribution: 'temurin'
      kotlin-version: '2.2.10'
      include-android: true
      include-universal: true
      play-track: ${{ inputs.play_track }}
      play-package-name: "org.mlm.repadio"
      prerelease: ${{ inputs.mark_prerelease }}
      bump-type: ${{ inputs.bump_type }}
      generate-release-notes: true
      changelog-path: 'CHANGELOG.md'
      version-file-path: './fastlane/metadata/android/en-US/changelogs/{{version_code}}.txt'
      metainfo-path: './others/flathub/io.github.mlm_games.repadio.metainfo.xml'
      dispatch-on-release: '["aur-upload.yml","choco-upload.yml","snap-upload.yml"]'
    secrets: inherit
