name: Release binaries

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      upload_releases:
        description: "Upload releases"
        required: true
        default: true
        type: boolean
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: release-bin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@main
    with:
      working-directory: .
      app-name: 'Repadio'
      app-slug: 'repadio'
      bin-name: 'repadio-desktop'
      os-matrix: '["ubuntu-26.04","ubuntu-26.04-arm","macos-latest","windows-latest"]'
      cargo-rapk-version: '0.17.2'
      android-api: '36'
      android-build-tools: '36.0.0'
      android-ndk-version: '28.2.13676358'
      android-d8-version: '8.10.9-dev'
      java-version: '21'
      java-distribution: 'temurin'
      include-android: true
      prerelease: ${{ inputs.mark_prerelease }}
      bump-type: ${{ inputs.bump_type }}
      generate-release-notes: true
      changelog-path: 'CHANGELOG.md'
      version-file-path: './fastlane/metadata/android/en-US/changelogs/{{version_code}}.txt'
      metainfo-path: './others/flathub/io.github.mlm_games.repadio.metainfo.xml'
      dispatch-on-release: '["aur-upload.yml","choco-upload.yml","snap-upload.yml"]'
    secrets: inherit
