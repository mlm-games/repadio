name: Snap upload
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 0.1.0)"
        required: true

concurrency:
  group: snap-${{ inputs.version_name }}

jobs:
  snap:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asset: '*x86_64-unknown-linux-gnu.tar.gz'
          - runner: ubuntu-26.04-arm
            asset: '*aarch64-unknown-linux-gnu.tar.gz'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux binary
        uses: robinraju/release-downloader@v1
        with:
          tag: v${{ inputs.version_name }}
          fileName: ${{ matrix.asset }}
          out-file-path: others/snap/builds

      - name: Extract binary
        shell: bash
        run: |
          tar xzf others/snap/builds/*.tar.gz -C others/snap/builds
          rm others/snap/builds/*.tar.gz
          if [ ! -f others/snap/builds/repadio ]; then
            found="$(find others/snap/builds -maxdepth 3 -type f -name 'repadio*' | head -n 1)"
            if [ -n "$found" ]; then
              mv "$found" others/snap/builds/repadio
            fi
          fi
          rm -rf others/snap/builds/repadio-*/
          ls -la others/snap/builds/
          test -f others/snap/builds/repadio

      - name: Prepare snap files
        shell: bash
        run: |
          mkdir -p others/snap/snap/gui
          cp others/flathub/io.github.mlm_games.repadio.desktop others/snap/snap/gui/
          cp others/packaging/icon.png others/snap/snap/gui/icon.png
          sed -i "s/version: '.*'/version: '${{ inputs.version_name }}'/" others/snap/snapcraft.yaml

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1
        with:
          path: others/snap

      - name: Publish snap
        uses: snapcore/action-publish@v1
        with:
          store_login: ${{ secrets.SNAP_STORE_LOGIN }}
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable
