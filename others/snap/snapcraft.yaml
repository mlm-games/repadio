name: repadio
base: core24
version: '0.2.0'
summary: Pure-Rust audio & video player built with Symphonia, videoson and CPAL
description: |
  Repadio is a cross-platform audio and video player built as a reference
  example for the Repose GUI framework. It uses Symphonia for audio, videoson
  for H.264/H.265/AV1, and CPAL for low-latency playback, all in pure Rust.
grade: stable
confinement: strict
icon: snap/gui/icon.png
title: Repadio
license: GPL-3.0-or-later
platforms:
  amd64:
  arm64:
apps:
  repadio:
    command: repadio
    extensions: [gnome]
    plugs:
      - home
      - network
      - removable-media
      - audio-playback
      - unity7
      - desktop
      - desktop-legacy
      - wayland
      - x11
parts:
  repadio:
    plugin: dump
    source: ./builds/
    source-type: local
    stage-packages:
      - libpulse0
      - libglu1-mesa
      - libxcursor1
      - libxinerama1
      - libxrandr2
      - libxi6
      - libudev1
    override-build: |
      craftctl default
      chmod +x $CRAFT_PART_INSTALL/repadio
